<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">BEMS: forecast, plan, validate and control</title>
<desc id="desc">Qualified device measurements feed forecasts and joint optimisation. A validated plan reaches the native single writer and the Solis and GARO actuators. Acknowledgements, setting readbacks and measured power return separately. Dashboard and history observe the process.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#49717b"/></marker></defs>
<rect width="1280" height="790" rx="24" fill="#f5f8f9"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#142d36">
<text x="44" y="55" font-size="28" font-weight="700">From a forecast to a physical action</text>
<text x="44" y="87" font-size="17" fill="#526773">Logical architecture · documented installation · not an electrical wiring diagram</text>
<g fill="#ffffff" stroke="#cddce1" stroke-width="1.5">
<rect x="44" y="130" width="352" height="190" rx="16"/>
<rect x="464" y="130" width="352" height="190" rx="16"/>
<rect x="884" y="130" width="352" height="190" rx="16"/>
<rect x="884" y="390" width="352" height="190" rx="16"/>
<rect x="464" y="390" width="352" height="190" rx="16" stroke="#087f75" stroke-width="2"/>
<rect x="44" y="390" width="352" height="190" rx="16"/>
</g>
<g font-size="13" font-weight="700" fill="#087f75">
<text x="66" y="160">01 / OBSERVE</text><text x="486" y="160">02 / FORECAST</text><text x="906" y="160">03 / PLAN</text>
<text x="906" y="420">04 / VALIDATE</text><text x="486" y="420">05 / EXECUTE</text><text x="66" y="420">PHYSICAL INSTALLATION</text>
</g>
<g font-size="23" font-weight="700">
<text x="66" y="194">Qualified telemetry</text><text x="486" y="194">Possible futures</text><text x="906" y="194">Joint optimisation</text>
<text x="906" y="454">Executable plan</text><text x="486" y="454">Native single writer</text><text x="66" y="454">Solis + GARO</text>
</g>
<g font-size="18" fill="#526773">
<text x="66" y="229">Grid · solar · battery · charger</text><text x="66" y="258">Identity, AC boundary, quality</text><text x="66" y="287">Source time and receipt time</text>
<text x="486" y="229">Household load · solar · prices</text><text x="486" y="258">Scenario and issuance history</text><text x="486" y="287">Vehicle context / user needs</text>
<text x="906" y="229">Battery · EV · grid intent</text><text x="906" y="258">Tariff and physical model</text><text x="906" y="287">Long-term energy value (J)</text>
<text x="906" y="489">Independent reconstruction</text><text x="906" y="518">Physics · charging · economics</text><text x="906" y="547">Saved inputs and validation</text>
<text x="486" y="489">Ownership · authority · feedback</text><text x="486" y="518">Phase / BMS / hour protection</text><text x="486" y="547">Commands, stops and readback</text>
<text x="66" y="489">Battery / inverter commands</text><text x="66" y="518">Charger enable / disable</text><text x="66" y="547">Real device response</text>
</g>
